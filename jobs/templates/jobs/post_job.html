<div class="container mt-4" style="max-width: 700px;">
    <h2>Post a New Job</h2>
    <hr>
    
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary mt-3">Publish Job</button>
        <a href="{% url 'job_list' %}" class="btn btn-secondary mt-3">Cancel</a>
    </form>
</div>
